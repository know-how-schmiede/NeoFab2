{% extends "base.html" %}
{% block title %}Mein Profil · NeoFab2{% endblock %}
{% block content %}
<h1>Mein Profil</h1>
<p>{{ current_user.email }} · {{ roles[current_user.role] }}</p>
<form method="post" class="card-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="display_name">Anzeigename</label><input id="display_name" name="display_name" value="{{ current_user.display_name }}" autocomplete="name" maxlength="100" required>
  <button type="submit">Profil speichern</button>
</form>
<h2>Passwort ändern</h2>
<p>8 bis 128 Zeichen. Nach der Änderung musst du dich auf allen Geräten neu anmelden.</p>
<form method="post" action="{{ url_for('accounts.password') }}" class="card-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="old_password">Aktuelles Passwort</label><input id="old_password" name="old_password" type="password" autocomplete="current-password" maxlength="128" required>
  <label for="new_password">Neues Passwort</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
  <label for="confirm_password">Neues Passwort wiederholen</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
  <button type="submit">Passwort ändern</button>
</form>
{% endblock %}
