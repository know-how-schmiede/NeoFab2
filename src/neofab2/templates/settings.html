{% extends "base.html" %}
{% block title %}Systemeinstellungen · NeoFab2{% endblock %}
{% block content %}
<h1>Systemeinstellungen</h1>
<p>Diese Angaben erscheinen auf der öffentlichen Startseite. Die Standarddarstellung gilt für Gäste und Konten ohne eigene Auswahl.</p>
<form method="post" class="card-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="site_name">Werkstattname</label>
  <input id="site_name" name="site_name" value="{{ values.site_name }}" maxlength="80" required>
  <label for="site_tagline">Kurzbeschreibung</label>
  <input id="site_tagline" name="site_tagline" value="{{ values.site_tagline }}" maxlength="160" required>
  <label for="welcome_text">Begrüßungstext</label>
  <textarea id="welcome_text" name="welcome_text" rows="6" maxlength="2000" required>{{ values.welcome_text }}</textarea>
  <label for="default_theme">Standarddarstellung</label>
  <select id="default_theme" name="default_theme">
    <option value="dark" {% if values.default_theme == 'dark' %}selected{% endif %}>Dunkel</option>
    <option value="light" {% if values.default_theme == 'light' %}selected{% endif %}>Hell</option>
  </select>
  <button type="submit">Einstellungen speichern</button>
</form>
{% endblock %}
